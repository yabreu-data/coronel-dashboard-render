<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Coronel · Sistema de Gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 12%, #fcf8ef 0%, #f5f1e8 64%);
        transition: opacity 0.4s ease;
      }
      #boot-splash.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11px;
        padding: 28px;
        text-align: center;
        animation: boot-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #boot-splash .boot-logo {
        width: min(235px, 68vw);
        padding: 4px 0 2px;
        background: radial-gradient(ellipse at center, #f4efe3 0%, rgba(244, 239, 227, 0) 70%);
      }
      #boot-splash .boot-logo img {
        display: block;
        width: 100%;
        height: auto;
        filter: none;
      }
      #boot-splash .boot-kicker {
        margin: 0;
        color: #8a998e;
        font: 800 9px/1.4 "Manrope", "Segoe UI", sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #boot-splash .boot-title {
        margin: 2px 0 0;
        color: #1e2e24;
        font: 600 clamp(30px, 4vw, 40px)/1.1 "Lora", Georgia, serif;
        letter-spacing: -0.04em;
      }
      #boot-splash .boot-message {
        max-width: 330px;
        margin: 0;
        color: #6b756c;
        font: 500 13px/1.6 "Manrope", "Segoe UI", sans-serif;
      }
      #boot-splash .boot-dots {
        display: flex;
        gap: 5px;
        margin: 4px 0 0;
      }
      #boot-splash .boot-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #b98a45;
        animation: boot-pulse 1.15s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.16s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.32s; }
      #boot-splash .boot-status {
        margin: 0;
        color: #8a998e;
        font: 700 9px/1.4 "Manrope", "Segoe UI", sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.32; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-dots span { animation: none; opacity: 0.6; }
        #boot-splash .boot-inner { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-logo">
          <img src="/manus-storage/logo-coronel.png" alt="Coronel" />
        </div>
        <p class="boot-kicker">Pollos y Parrillas</p>
        <h1 class="boot-title">Bienvenido a Coronel</h1>
        <p class="boot-message">Cada cliente cuenta. Estamos preparando tu día con todo en orden.</p>
        <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="boot-status">Un momento, por favor</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
