<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Coronel · Sistema de Gestión</title>
    <style>
      html,
      body {
        margin: 0;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 18%, #eaf6ef 0%, #f6faf7 62%);
        transition: opacity 0.35s ease;
      }
      #boot-splash.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      #boot-splash .boot-logo {
        width: min(320px, 78vw);
      }
      #boot-splash .boot-logo img {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 12px 24px rgba(29, 74, 49, 0.12));
      }
      #boot-splash .boot-brand {
        margin: 0;
        color: #1d4a31;
        font: 900 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #boot-splash .boot-spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 3px solid #d7e8dd;
        border-top-color: #d93a2b;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-splash .boot-status {
        margin: 0;
        color: #557565;
        font: 800 10px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-logo">
          <img src="/manus-storage/logo-coronel.png" alt="Coronel" />
        </div>
        <p class="boot-brand">Sistema de gestión</p>
        <div class="boot-spinner"></div>
        <p class="boot-status">Preparando tu dashboard…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
